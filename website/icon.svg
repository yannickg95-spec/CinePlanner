<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CinePlanner">
  <defs>
    <linearGradient id="cpBars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ECFFF"/>
      <stop offset="1" stop-color="#1A4AFF"/>
    </linearGradient>
    <linearGradient id="cpTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7fc"/>
    </linearGradient>
    <filter id="cpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1A4AFF" flood-opacity="0.16"/>
    </filter>
  </defs>
  <!-- Full-bleed bright tile (rounded to match the CSS radius so the glow hugs the edge) -->
  <rect x="0" y="0" width="512" height="512" rx="93" fill="url(#cpTile)"/>
  <!-- CinePlanner mark: four shot-list bars (from the app logo, scaled 5.12×) -->
  <g transform="scale(5.12)" fill="url(#cpBars)" filter="url(#cpShadow)">
    <rect x="11.6" y="15.6" width="76.4" height="12.2" rx="6.1"/>
    <rect x="11.6" y="34.1" width="61.9" height="12.2" rx="6.1"/>
    <rect x="11.6" y="52.6" width="70.3" height="12.2" rx="6.1"/>
    <rect x="11.6" y="71.1" width="48.1" height="12.2" rx="6.1"/>
  </g>
</svg>
