<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CinePlanner">
  <defs>
    <linearGradient id="cpGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8c96a"/>
      <stop offset="0.55" stop-color="#f5b544"/>
      <stop offset="1" stop-color="#e8722d"/>
    </linearGradient>
    <linearGradient id="cpSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#cpGold)"/>
  <rect x="16" y="16" width="480" height="240" rx="112" fill="url(#cpSheen)"/>
  <!-- clapperboard top bar -->
  <g fill="#0a0a12">
    <path d="M120 150 L392 150 L392 196 L120 196 Z"/>
  </g>
  <g fill="#f5b544">
    <path d="M150 150 L176 150 L156 196 L130 196 Z"/>
    <path d="M206 150 L232 150 L212 196 L186 196 Z"/>
    <path d="M262 150 L288 150 L268 196 L242 196 Z"/>
    <path d="M318 150 L344 150 L324 196 L298 196 Z"/>
  </g>
  <!-- shot list lines (the "plan") -->
  <g fill="#0a0a12">
    <rect x="120" y="228" width="200" height="26" rx="13"/>
    <rect x="120" y="284" width="272" height="26" rx="13"/>
    <rect x="120" y="340" width="164" height="26" rx="13"/>
  </g>
  <!-- checkmarks: shot done -->
  <g fill="none" stroke="#0a0a12" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M344 232 l16 16 l28 -30"/>
    <path d="M312 344 l16 16 l28 -30"/>
  </g>
</svg>
